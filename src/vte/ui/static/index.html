<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VTE — 영상 속 텍스트 추출</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%238ab4f8'/></svg>" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <span class="dot"></span>
        VTE <span class="sub">영상 속 텍스트 추출</span>
      </div>
      <div class="spacer"></div>
      <div id="status-pill" class="status-pill" data-state="idle">
        <span class="led"></span><span class="label">대기 중</span>
      </div>
    </header>

    <div class="workspace">
      <!-- 상단: 화면 진행 (미리보기 + 진행바) -->
      <section class="panel panel--preview" data-panel="preview">
        <div class="panel-header">
          화면 진행
          <div class="spacer"></div>
          <span id="preview-meta" class="tt-row-conf" style="font-size:12px;color:var(--fg-2)"></span>
        </div>
        <div class="panel-body" id="preview-body"></div>
      </section>

      <!-- 하단: 추출된 텍스트 -->
      <section class="panel panel--transcript" data-panel="transcript">
        <div class="panel-header">
          추출된 텍스트
          <div class="spacer"></div>
          <span id="transcript-count" style="font-size:12px;color:var(--fg-2)">0개</span>
        </div>
        <div class="panel-body" id="transcript-body"></div>
      </section>

      <!-- 우측: 제어 + 내보내기 (모듈 패널들이 여기에 mount) -->
      <aside class="panel panel--sidebar" data-panel="sidebar"></aside>
    </div>

    <div id="toast"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
